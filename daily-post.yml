name: Daily Instagram Post

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST daily — adjust as you like
  workflow_dispatch: {}

permissions:
  contents: write # needed so the workflow can commit the day's image back to the repo

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install

      - run: node index.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NICHE_PROMPT: ${{ vars.NICHE_PROMPT }}
